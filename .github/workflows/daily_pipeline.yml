name: Daily data refresh

# Runs the fetch/score pipeline (main.py) on weekday afternoons after US
# market close and commits refreshed data/ back to the repo. Needs no
# secrets: the wired fetch path (verticals/*.py) is yfinance-backed, and
# ANALYZE stays off in main.py's committed flags, so no ANTHROPIC_API_KEY
# is required either. See CLAUDE.md for the pipeline architecture.

on:
  schedule:
    # 21:30 UTC ≈ 4:30pm ET, shortly after market close, Mon-Fri
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python main.py

      - name: Commit and push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "Daily data refresh — $(date -u +%Y-%m-%d)"
            git push
          fi
