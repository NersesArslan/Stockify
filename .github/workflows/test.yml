name: Tests

# Runs the scoring test suite on every push and pull request. Separate from
# daily_pipeline.yml (which fetches/scores/commits on a schedule) — this
# workflow never touches data/, it only checks scoring.py's logic against
# tests/fixtures/synthetic_universe.csv (fixed inputs, immune to market
# moves) plus a couple of live-data drift checks (test_archetype_coverage,
# test_ai_exposure_no_unknowns) against whatever's currently committed.
# See CLAUDE.md for the pipeline architecture.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==9.1.1

      - name: Run tests
        run: pytest tests/ -v
